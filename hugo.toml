baseURL = 'https://go-dataframe.github.io/'
locale  = 'en-us'
title   = 'go-dataframe'
# No theme -- the layout is the go-* family template (go-fileshare.github.io's,
# via logos/landing-kit, as go-plot and go-notebook use it): one
# self-contained layouts/index.html, partials/styles.html (the shared sheet,
# byte-identical) and partials/theme-toggle.html (system / light / dark).

disableKinds = ['taxonomy', 'term', 'rss', 'sitemap', '404']

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = "go-dataframe: labelled columnar tables in pure Go (CGO=0) on go-ndarray. Series, DataFrame and Index, CSV, Arrow and Parquet, group-by, joins, reshaping, time series, notebook display and plots."

# Every field below is rendered by layouts/index.html (cards in #repos, the
# strip under the hero). A field nothing renders does not stay true.
[[params.repos]]
  name  = "dataframe"
  kind  = "library"
  href  = "https://github.com/go-dataframe/dataframe"
  blurb = "The library: <code>Series</code>, <code>DataFrame</code> and <code>Index</code>, selection, missing data, group-by, joins, reshaping, time series, a fast CSV reader and notebook display; <code>arrowio</code> (Arrow IPC, Feather), <code>parquetio</code> (Parquet) and <code>dfplot</code> (plots with go-plot)."
[[params.repos]]
  name  = "docs"
  kind  = "site"
  href  = "https://go-dataframe.github.io/docs/"
  blurb = "The documentation (Hugo + Hextra): the API call by call, notebook display and plots produced by v0.1.0, and the library's design and performance documents. <a href=\"https://github.com/go-dataframe/docs\">Source →</a>"
[[params.repos]]
  name  = "brand"
  kind  = "assets"
  href  = "https://github.com/go-dataframe/brand"
  blurb = "Logos and icons for the organization, in SVG / PNG / JPG / ICO / ICNS across colour, white and black variants."

# The cards of #exact and their count come from this list. Each statement is
# from go-dataframe/dataframe's README at v0.1.0.
[[params.checks]]
  name = "173 recorded cases"
  what = "`testdata/gen_fixtures.py` records pandas 3.0's answers — values, dtypes, index, NA handling, sort stability, group-by order, merge row order, `repr` text — and `TestPandasFixtures` replays them."
[[params.checks]]
  name = "47 awkward CSV files"
  what = "A corpus of 47 awkward CSV files, read with 69 option sets, compared with pandas' parse of the same files."
[[params.checks]]
  name = "Arrow and Parquet written elsewhere"
  what = "Arrow and Parquet files written by pandas and pyarrow are read back and compared."
[[params.checks]]
  name = "Coverage under the race detector"
  what = "100% statement coverage of the whole module under `-race`, on Linux, macOS and Windows."
[[params.checks]]
  name = "Six architectures"
  what = "Tests run natively on amd64 and arm64 and under qemu on riscv64, loong64, ppc64le and s390x, which is big-endian."
[[params.checks]]
  name = "Differences, listed"
  what = "What does not follow pandas does so on purpose, and is listed in the design document, not left to be discovered."

[params.brand]
# Generated by logos/landing-kit/kit.py from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 5.81:1, bright on the dark background 8.71:1.
  base = "#a93a82"
  deep = "#67234f"
  bright = "#ee8fcf"
  shadow = "rgba(169,58,130,.7)"
  glow = "rgba(169,58,130,.6)"
  wash = "rgba(169,58,130,.10)"
  washDeep = "rgba(103,35,79,.06)"
  chipBg = "#fdf2f9"
  chipBorder = "#faddf1"
  chipFg = "#67234f"
  chipBgDark = "rgba(238,143,207,.14)"
  chipBorderDark = "rgba(238,143,207,.32)"
  chipFgDark = "#f6c1e5"
