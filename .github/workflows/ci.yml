name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: the site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true
      - run: hugo --minify
      # A page that builds and says nothing is a page nobody notices is empty.
      - name: every repository is on it
        run: |
          for repo in dataframe docs brand; do
            grep -q "go-dataframe/$repo" public/index.html \
              || { echo "::error::$repo is not on the page"; exit 1; }
          done
          echo "the page names every repository this org has"

  # static/out/frame.txt, static/out/frame.html and static/img/figure.svg are
  # what figure/main.go writes, with the go-dataframe version figure/go.mod
  # names. The page shows that program as the terminal in the hero, so an
  # output that no longer matches it would be a claim the page cannot back.
  # This runs it again and compares the bytes.
  figure:
    name: the outputs are what their program writes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: figure/go.mod
          cache-dependency-path: figure/go.sum
      - name: Run the program
        working-directory: figure
        run: go run . ../static
      - name: The committed outputs are the ones written
        run: |
          if ! git diff --exit-code --stat -- static/out static/img/figure.svg; then
            echo "::error::an output differs from what figure/main.go writes: run 'cd figure && go run . ../static' and commit it"
            exit 1
          fi
